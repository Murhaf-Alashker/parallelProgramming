services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: parallelProgramming
            DB_USERNAME: root
            DB_PASSWORD: dockerRoot1234
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    app2:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app_2
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: parallelProgramming
            DB_USERNAME: root
            DB_PASSWORD: dockerRoot1234
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    app3:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app_3
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: parallelProgramming
            DB_USERNAME: root
            DB_PASSWORD: dockerRoot1234
            REDIS_CLIENT: predis
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
            - app2
            - app3

    mysql:
        image: mysql:8.4
        container_name: laravel_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: parallelProgramming
            MYSQL_ROOT_PASSWORD: dockerRoot1234
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
              ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: laravel_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    mysql_data:
    redis_data:
